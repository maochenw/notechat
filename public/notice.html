<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NoteChat has moved</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      color: #253240;
      background: linear-gradient(145deg, #f8fbff, #eaf3fd);
    }
    main {
      width: 100%;
      max-width: 520px;
      padding: clamp(24px, 6vw, 48px);
      background: #fff;
      border: 1px solid #bfd0e2;
      border-radius: 20px;
      box-shadow: 0 16px 48px rgba(37, 50, 64, .08);
    }
    .brand { margin: 0 0 24px; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 0 0 16px; font-size: clamp(28px, 6vw, 36px); line-height: 1.15; }
    p { margin: 0 0 16px; line-height: 1.65; color: #506477; }
    a {
      display: inline-block;
      margin-top: 12px;
      padding: 14px 20px;
      border-radius: 10px;
      background: #253240;
      color: #fff;
      font-weight: 600;
      text-decoration: none;
    }
    a:hover { background: #40576c; }
    a:focus-visible { outline: 3px solid #237ac4; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <p class="brand">NOTECHAT</p>
    <h1>NoteChat has moved</h1>
    <p>This version of the site is no longer working. NoteChat needs a web service to run its login and chat features, but this address is hosted as a static website.</p>
    <p>Please go to bigtiger.xyz to use NoteChat.</p>
    <a href="https://bigtiger.xyz/" target="_top">Go to bigtiger.xyz &rarr;</a>
  </main>
</body>
</html>
